<!DOCTYPE html>
<html>
<head>
    <title>Variable Array Example</title>
</head>

<body>

<h2 id="demo"></h2>

<script>
// Variables
let name = "Abhi";
let age = 20;

// Array
let fruits = ["Apple", "Mango", "Banana"];

// Output on screen
document.getElementById("demo").innerHTML =
    "Name: " + name + "<br>" +
    "Age: " + age + "<br>" +
    "First Fruit: " + fruits[0];
</script>

</body>
</html>
